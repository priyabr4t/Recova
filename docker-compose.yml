services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: recova
      POSTGRES_PASSWORD: recova
      POSTGRES_DB: recova
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"

volumes:
  pgdata:
